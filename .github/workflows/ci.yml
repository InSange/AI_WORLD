name: WorldAI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/worldai
        
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # ruff 는 버전이 오르면 기본 규칙셋이 넓어져 코드 변경 없이 CI 가 깨진다.
        # ruff.toml 에 검사 규칙을 명시해 두었고, 여기서 마이너 버전도 고정한다.
        pip install "ruff>=0.16,<0.17" mypy pytest httpx typing-extensions types-PyYAML
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with Ruff
      run: |
        python -m ruff check src/

    - name: Type check with Mypy
      run: |
        python -m mypy src/

    - name: Run Tests
      # PYTHONPATH 셋팅 후 pytest 실행
      run: |
        PYTHONPATH=. pytest tests/ -v
